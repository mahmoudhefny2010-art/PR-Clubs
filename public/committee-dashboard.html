<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Committee Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css?v=20261005-my-forms" />
    <link rel="icon" href="/logo.svg.png" type="image/png">
</head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand-wrap brand-home-link" href="/" aria-label="MIU homepage">
          <img class="brand-mark" src="/logo.svg.png" alt="MIU logo" />
          <div class="brand-text">MIU</div>
        </a>
      </header>

      <main class="app-container">
        <section class="committee-card">
          <div class="committee-top">
            <div class="committee-label">COMMITTEE REVIEW</div>
            <h2 id="committeeTitle">Innovation and Technology Committee</h2>
            <div class="top-actions">
              <a class="secondary-btn" href="/">Back to Clubs</a>
              <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
            </div>
          </div>

          <div class="stats-row">
            <div class="stat-box">
              <span>Total</span>
              <strong id="statTotal">0</strong>
            </div>
            <div class="stat-box">
              <span>Accepted</span>
              <strong id="statAccepted">0</strong>
            </div>
            <div class="stat-box">
              <span>Rejected</span>
              <strong id="statRejected">0</strong>
            </div>
          </div>

          <div id="applicationsList" class="applications-list"></div>
        </section>
      </main>
    </div>

    <div id="reviewModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Interview Evaluation</h3>
          <button id="closeModalBtn" class="close-btn" type="button">✕</button>
        </div>

        <div class="avatar-box">A</div>

        <div class="form-row">
          <div class="modal-field">
            <label>Applicant</label>
            <div id="modalName" class="field-value"></div>
          </div>
          <div class="modal-field">
            <label>Email</label>
            <div id="modalEmail" class="field-value"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="modal-field">
            <label>How old are you</label>
            <input id="modalAge" type="text" />
          </div>
          <div class="modal-field">
            <label>Why do you want to join this?</label>
            <input id="modalMotivation" type="text" />
          </div>
        </div>

        <div class="form-row">
          <div class="modal-field">
            <label>Notes</label>
            <textarea id="modalNotes"></textarea>
          </div>
          <div class="modal-field">
            <label>Rating</label>
            <select id="modalRating">
              <option value="1">1/5</option>
              <option value="2">2/5</option>
              <option value="3">3/5</option>
              <option value="4" selected>4/5</option>
              <option value="5">5/5</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="modal-field full-width">
            <label>Photo</label>
            <div class="photo-box">
              <input type="file" id="modalPhoto" />
              <span id="photoName">No file chosen</span>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="action-btn secondary" id="saveReviewBtn">Save</button>
          <button type="button" class="action-btn success" id="acceptReviewBtn">Accept</button>
          <button type="button" class="action-btn danger" id="rejectReviewBtn">Reject</button>
        </div>
      </div>
    </div>

    <script src="/script.js"></script>
    <script src="/theme.js?v=20261005-global-theme" defer></script>
    <script>
      const applicationsList = document.getElementById('applicationsList');
      const statTotal = document.getElementById('statTotal');
      const statAccepted = document.getElementById('statAccepted');
      const statRejected = document.getElementById('statRejected');
      const committeeTitle = document.getElementById('committeeTitle');
      const reviewModal = document.getElementById('reviewModal');
      const modalName = document.getElementById('modalName');
      const modalEmail = document.getElementById('modalEmail');
      const modalAge = document.getElementById('modalAge');
      const modalMotivation = document.getElementById('modalMotivation');
      const modalNotes = document.getElementById('modalNotes');
      const modalRating = document.getElementById('modalRating');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const photoName = document.getElementById('photoName');

      let selectedApplication = null;

      const applicants = [
        {
          id: 1,
          studentName: 'Mohamed Medhat',
          email: 'mohamed2056794@miuegypt.edu.eg',
          universityId: '2026-05794',
          major: 'Electronics and Communication Engineering',
          phone: '01023311662',
          slot: 'Saturday 1:00 PM - 1:10 PM',
          committee: 'Innovation and Technology Committee',
          age: '20',
          motivation: 'I want to learn more about tech projects and work with creative teams.',
          notes: 'Strong interest in technology and innovation.',
          rating: 4,
          status: 'pending',
          photo: ''
        },
        {
          id: 2,
          studentName: 'Mahmoud Hefny',
          email: 'mahmoud2406700@miuegypt.edu.eg',
          universityId: '26-06700',
          major: 'Computer Science',
          phone: '01080243466',
          slot: 'Sunday 2:30 PM - 2:40 PM',
          committee: 'Innovation and Technology Committee',
          age: '21',
          motivation: 'I would like to gain experience in product thinking and team collaborations.',
          notes: 'Good technical background and communication skills.',
          rating: 4,
          status: 'accepted',
          photo: ''
        },
        {
          id: 3,
          studentName: 'Omar Mohamed',
          email: 'omar2607942@miuegypt.edu.eg',
          universityId: '26-07942',
          major: 'Computer Science',
          phone: '01092042401',
          slot: 'Tuesday 11:00 AM - 11:10 AM',
          committee: 'Innovation and Technology Committee',
          age: '19',
          motivation: 'I want to contribute to coding projects and improve my problem-solving skills.',
          notes: 'Promising candidate with strong curiosity.',
          rating: 3,
          status: 'pending',
          photo: ''
        }
      ];

      function renderApplicants() {
        const total = applicants.length;
        const accepted = applicants.filter((app) => app.status === 'accepted').length;
        const rejected = applicants.filter((app) => app.status === 'rejected').length;

        statTotal.textContent = total;
        statAccepted.textContent = accepted;
        statRejected.textContent = rejected;
        committeeTitle.textContent = 'Innovation and Technology Committee';

        applicationsList.innerHTML = applicants.map((app) => `
          <article class="application-card">
            <div class="application-row">
              <div>
                <div class="applicant-head">${app.studentName}</div>
                <div class="applicant-meta">
                  <span>ID: ${app.universityId}</span>
                  <span>Major: ${app.major}</span>
                </div>
                <div class="applicant-meta">
                  <span>${app.email}</span>
                  <span>Phone: ${app.phone}</span>
                </div>
                <div class="applicant-meta">
                  <span>Slot: ${app.slot}</span>
                </div>
              </div>
              <span class="badge ${app.status}">${app.status}</span>
            </div>

            <div class="card-actions">
              <button class="preview-btn" data-action="preview" data-id="${app.id}">Preview</button>
              <button class="delete-btn" data-action="delete" data-id="${app.id}">Delete</button>
            </div>
          </article>
        `).join('');

        document.querySelectorAll('[data-action="preview"]').forEach((button) => {
          button.addEventListener('click', () => openReviewModal(Number(button.dataset.id)));
        });

        document.querySelectorAll('[data-action="delete"]').forEach((button) => {
          button.addEventListener('click', () => {
            const id = Number(button.dataset.id);
            const index = applicants.findIndex((app) => app.id === id);
            if (index >= 0) applicants.splice(index, 1);
            renderApplicants();
          });
        });
      }

      function openReviewModal(appId) {
        const app = applicants.find((item) => item.id === appId);
        if (!app) return;

        selectedApplication = app;
        modalName.textContent = app.studentName;
        modalEmail.textContent = app.email;
        modalAge.value = app.age || '';
        modalMotivation.value = app.motivation || '';
        modalNotes.value = app.notes || '';
        modalRating.value = String(app.rating || 4);
        photoName.textContent = app.photo ? 'Uploaded' : 'No file chosen';
        reviewModal.classList.remove('hidden');
      }

      closeModalBtn.addEventListener('click', () => reviewModal.classList.add('hidden'));

      document.getElementById('saveReviewBtn').addEventListener('click', () => {
        if (!selectedApplication) return;
        selectedApplication.notes = modalNotes.value;
        selectedApplication.rating = Number(modalRating.value);
        reviewModal.classList.add('hidden');
        renderApplicants();
      });

      document.getElementById('acceptReviewBtn').addEventListener('click', () => {
        if (!selectedApplication) return;
        selectedApplication.status = 'accepted';
        selectedApplication.notes = modalNotes.value;
        selectedApplication.rating = Number(modalRating.value);
        reviewModal.classList.add('hidden');
        renderApplicants();
      });

      document.getElementById('rejectReviewBtn').addEventListener('click', () => {
        if (!selectedApplication) return;
        selectedApplication.status = 'rejected';
        selectedApplication.notes = modalNotes.value;
        selectedApplication.rating = Number(modalRating.value);
        reviewModal.classList.add('hidden');
        renderApplicants();
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        window.location.href = '/index.html';
      });

      document.getElementById('modalPhoto').addEventListener('change', (event) => {
        const file = event.target.files[0];
        photoName.textContent = file ? file.name : 'No file chosen';
      });

      renderApplicants();
    </script>
  </body>
</html>
