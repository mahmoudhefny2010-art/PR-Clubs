<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css?v=20261005-my-forms" />
    <link rel="icon" href="/logo.svg.png" type="image/png">
</head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand-wrap brand-home-link" href="/" aria-label="MIU homepage">
          <img class="brand-mark" src="/logo.svg.png" alt="MIU logo" />
          <div class="brand-text">MIU</div>
        </a>
      </header>

      <main class="app-container">
        <section class="club-detail-card" id="clubDetailPage"></section>
      </main>
    </div>

    <script src="/script.js"></script>
    <script src="/theme.js?v=20261005-global-theme" defer></script>
    <script>
      const clubDetailPage = document.getElementById('clubDetailPage');
      const clubId = Number(new URLSearchParams(window.location.search).get('id')) || 1;

      const clubs = [
        {
          id: 1,
          name: 'Innovation and Technology',
          committee: 'Innovation and Technology Committee',
          category: 'Technology',
          status: 'open',
          seats: 25,
          members: 18,
          applicants: 3,
          description: 'A club for tech enthusiasts, builders, and problem-solvers focused on software, robotics, and innovative ideas.',
          requirements: 'Interest in technology, creativity, and teamwork.'
        },
        {
          id: 2,
          name: 'Media and Design',
          committee: 'Media Committee',
          category: 'Media',
          status: 'open',
          seats: 20,
          members: 15,
          applicants: 2,
          description: 'Create visual content, campaigns, and design work for university events and online impact.',
          requirements: 'Creative mindset and willingness to contribute design work.'
        },
        {
          id: 3,
          name: 'Sports and Fitness',
          committee: 'Sports Committee',
          category: 'Sports',
          status: 'full',
          seats: 30,
          members: 30,
          applicants: 4,
          description: 'Promotes healthy lifestyles through tournaments, sports activities, and fitness challenges.',
          requirements: 'Enjoy teamwork and active participation.'
        },
        {
          id: 4,
          name: 'Public Relations',
          committee: 'PR Committee',
          category: 'Communication',
          status: 'open',
          seats: 18,
          members: 12,
          applicants: 5,
          description: 'Develop communication strategies, outreach campaigns, and student engagement activities.',
          requirements: 'Strong communication and public interaction skills.'
        }
      ];

      const club = clubs.find((item) => item.id === clubId) || clubs[0];

      clubDetailPage.innerHTML = `
        <div class="club-header-row">
          <span class="club-tag">${club.category}</span>
        </div>
        <h2 class="detail-title">${club.name}</h2>
        <div class="detail-meta">Committee: ${club.committee}</div>
        <p class="detail-description">${club.description}</p>

        <div class="detail-info">
          <div class="detail-box">
            <p>Status</p>
            <strong>${club.status}</strong>
          </div>
          <div class="detail-box">
            <p>Members</p>
            <strong>${club.members}</strong>
          </div>
          <div class="detail-box">
            <p>Seats</p>
            <strong>${club.seats}</strong>
          </div>
          <div class="detail-box">
            <p>Applicants</p>
            <strong>${club.applicants}</strong>
          </div>
        </div>

        <div class="details-section">
          <h3>Requirements</h3>
          <p>${club.requirements}</p>
        </div>

        <div class="detail-actions">
          <a class="primary-btn" href="/club-application.html?id=${club.id}">Apply Now</a>
          <a class="secondary-btn" href="/index.html">Back to Clubs</a>
        </div>
      `;
    </script>
  </body>
</html>
