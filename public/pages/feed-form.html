<!DOCTYPE html>
<html lang="en">
  <head>
      <link rel="manifest" href="/manifest.webmanifest">

    <title>Feed Studio</title>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" /></noscript>
    <link rel="stylesheet" href="/assets/css/base.css?v=20261017footerwrap2" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261015mainadmin1" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261015mainadmin1" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261018fullwidthreviewnotice1" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/pics/pwa-icon-192.png?v=20261013favicon1">
    <link rel="stylesheet" href="/assets/css/pages/content-form.css?v=20261014reviewcontrast2" />
      <script defer src="/assets/js/pwa-register.js?v=20261014localfresh1"></script>
    <link rel="stylesheet" href="/assets/css/modal-controls.css?v=20261018fullwidthreviewnotice1">
  <script src="/assets/js/feed-media.js?v=20261015videopopup1"></script>
</head>
  <body>
    <div id="site-header"></div>
    <main class="app-container">
      <section class="committee-card">
        <div class="committee-top">
          <div>
            <div class="committee-label">FEED MODULE</div>
            <h2 id="studioTitle">Feed Studio</h2>
          </div>
          <div class="top-actions">
            <a class="secondary-btn" href="/" data-history-back>Back</a>
          </div>
        </div>
        <nav class="module-nav" aria-label="Content modules">
          <a href="/pages/event-form.html">Events</a>
          <a href="/pages/feed-form.html" class="is-active">Feed</a>
          <a href="/pages/sponsor-form.html">Sponsors</a>
          <a href="/pages/booth-form.html">Booths</a>
          <a href="/pages/club-content.html">All content</a>
        </nav>
        <p id="sessionMessage"></p>
        <div class="content-layout" id="contentLayout" hidden>
          <div class="panel">
            <h2 id="formTitle">New feed post</h2>
            <form id="contentForm">
              <label>Title</label>
              <input id="titleInput" required />
              <label for="dateInput">Post date</label>
              <input id="dateInput" type="date" aria-describedby="dateHint" />
              <small id="dateHint" class="meta">Optional. The saved format is YYYY-MM-DD, for example 2026-10-20.</small>
              <label for="timeInput">Time</label>
              <input id="timeInput" type="time" />
              <label>Description</label>
              <textarea id="descInput"></textarea>
              <label for="imageInput">Image or video (required for review)</label>
              <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm" aria-describedby="feedMediaHint" />
              <small id="feedMediaHint" class="meta">Choose an image up to 10 MB or an MP4 / WebM video up to 50 MB. Drafts can be saved without media.</small>
              <div id="feedMediaPreview"></div>
              <div class="content-form-actions">
                <button class="primary-btn" type="submit" name="action" value="draft">Save as draft</button>
                <button class="secondary-btn" type="button" id="submitReviewBtn">Submit for review</button>
                <button class="secondary-btn" type="button" id="resetFormBtn">Clear</button>
              </div>
              <p id="formFeedback"></p>
            </form>
          </div>
          <div class="panel">
            <h2>Your feed</h2>
            <div class="content-list" id="contentList"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="/assets/js/content-studio.js?v=20261018compactreviewupdates1"></script>
    <script src="/assets/js/date-time-picker.js?v=20261010pickers1"></script>
    <script src="/assets/js/cloudinary-upload.js?v=20261015feedvideo1"></script>
    <script src="/assets/js/pages/feed-form.js?v=20261015feedvideo1"></script>
    <script src="/assets/js/layout.js?v=20261017footercache2" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
