<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Forgot Password — MIU Student Club Portal</title>
    <link rel="stylesheet" href="/assets/css/base.css?v=20261007d" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005h" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261009c" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261005h" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png" />
    <style>
      .recovery-wrap { max-width: 460px; margin: 48px auto; padding: 32px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); }
      .recovery-wrap h1 { margin: 0 0 8px; font-size: 1.7rem; }
      .recovery-wrap > p { color: var(--text-muted); line-height: 1.6; }
      .recovery-actions { display: grid; gap: 12px; margin-top: 18px; }
      .recovery-feedback { min-height: 24px; margin: 16px 0 0; }
      .recovery-back { display: inline-block; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div id="site-header"></div>
      <main class="app-container">
        <section class="recovery-wrap" aria-labelledby="forgotTitle">
          <span class="admin-eyebrow">ACCOUNT RECOVERY</span>
          <h1 id="forgotTitle">Forgot Password?</h1>
          <p>Enter your email address and we'll send you a password reset link.</p>
          <form id="forgotPasswordForm" novalidate>
            <div class="field-group">
              <label for="recoveryEmail">Email address</label>
              <input id="recoveryEmail" name="email" type="email" autocomplete="email" maxlength="254" required />
            </div>
            <div class="recovery-actions">
              <button class="primary-btn" id="sendResetLinkBtn" type="submit">Send Reset Link</button>
            </div>
          </form>
          <p id="forgotPasswordFeedback" class="admin-feedback recovery-feedback" aria-live="polite"></p>
          <a class="text-button recovery-back" href="/pages/applicant-login.html">Back to Login</a>
        </section>
      </main>
    </div>
    <div id="site-footer"></div>
    <script>
      const forgotForm = document.getElementById('forgotPasswordForm');
      const forgotFeedback = document.getElementById('forgotPasswordFeedback');
      forgotForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        forgotFeedback.textContent = '';
        forgotFeedback.classList.remove('is-error');
        const emailInput = document.getElementById('recoveryEmail');
        const email = emailInput.value.trim();
        if (!emailInput.checkValidity()) {
          emailInput.reportValidity();
          return;
        }
        const button = document.getElementById('sendResetLinkBtn');
        button.disabled = true;
        try {
          const response = await fetch('/api/password-reset/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || 'Password recovery is temporarily unavailable.');
          forgotFeedback.textContent = result.message;
          forgotForm.reset();
        } catch (error) {
          forgotFeedback.textContent = error.message;
          forgotFeedback.classList.add('is-error');
        } finally {
          button.disabled = false;
        }
      });
    </script>
    <script src="/assets/js/layout.js?v=11" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
