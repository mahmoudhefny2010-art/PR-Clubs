    <title>Sponsors - MIU Clubs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" /></noscript>
    <link rel="stylesheet" href="/assets/css/base.css?v=20261010loading2" />

    <link rel="stylesheet" href="/assets/css/pages/events.css?v=12" />
    <link rel="stylesheet" href="/assets/css/event-modal.css?v=2" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
  </head>
  <body>
    <div class="page-shell">
      <div id="site-header"></div>

      <main class="app-container">
        <section class="events-page">
          <div class="welcome-box hero-panel">
            <h1>Club Sponsors</h1>
            <p>Approved partners and sponsors supporting student activities. Pick a sponsor to see full details.</p>
            <div class="home-form-actions">
              <a class="secondary-btn" href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg>
                <span>Back to clubs</span>
              </a>
            </div>
          </div>

          <div id="sponsorsList" class="events-timeline"></div>

          <div id="sponsorDetail" class="event-modal hidden" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
            <article class="event-modal-panel">
              <button id="sponsorBack" class="calendar-close-btn event-modal-close" type="button" aria-label="Close sponsor details">&times;</button>
              <img id="detailImg" class="event-modal-image" src="" alt="sponsor" />
              <div class="event-modal-copy">
                <span class="event-modal-club" id="detailClub"></span>
                <h2 id="detailTitle"></h2>
                <p id="detailDesc" class="event-modal-description"></p>
              </div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <div id="site-footer"></div>

    <script src="/assets/js/pages/sponsors.js?v=3"></script>
    <script src="/assets/js/layout.js?v=20261010passwordeye1" defer></script>
