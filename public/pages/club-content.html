<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Content Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css?v=20261005e" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005e" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261005e" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261005e" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
    <style>
      .content-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
      @media (max-width: 900px) { .content-layout { grid-template-columns: 1fr; } }
      .panel { background: #fff; border: 1px solid #f0d7d7; border-radius: 18px; padding: 18px; }
      .panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
      .panel label { display: block; font-weight: 700; font-size: .82rem; margin: 10px 0 4px; }
      .panel input, .panel select, .panel textarea { width: 100%; padding: 10px 12px; border: 1px solid #e5cfd0; border-radius: 10px; font: inherit; }
      .panel textarea { min-height: 90px; }
      .content-list { display: flex; flex-direction: column; gap: 12px; }
      .content-card { border: 1px solid #eee; border-radius: 14px; padding: 12px; display: flex; gap: 12px; }
      .content-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; }
      .content-card .meta { font-size: .8rem; color: #6b7280; }
      .status-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 800; text-transform: uppercase; }
      .status-draft { background: #f3f4f6; color: #374151; }
      .status-pending_pr, .status-pending_english, .status-pending_dean { background: #fff1d5; color: #92400e; }
      .status-changes_requested { background: #fde8e8; color: #b71c1c; }
      .status-rejected { background: #fee2e2; color: #991b1b; }
      .status-published { background: #dcfce7; color: #166534; }
      body.embed .topbar { display: none; }
      body.embed .app-container { max-width: 100%; margin: 0; padding: 0; }
      .mini-btn { padding: 4px 10px; border-radius: 999px; border: 1px solid #ddd; background: #fff; font-weight: 700; cursor: pointer; font-size: .75rem; }
    </style>
  </head>
  <body>
    <div id="site-header"></div>
    <main class="app-container">
      <section class="committee-card">
        <div class="committee-top">
          <div>
            <div class="committee-label">CLUB CONTENT</div>
            <h2 id="studioTitle">Content Studio</h2>
          </div>
          <div class="top-actions">
            <a class="secondary-btn" href="/">Back</a>
            <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
          </div>
        </div>
        <p id="sessionMessage"></p>
        <div class="content-layout" id="contentLayout" hidden>
          <div class="panel">
            <h2 id="formTitle">New post / event</h2>
            <form id="contentForm">
              <label>Type</label>
              <select id="typeInput"><option value="post">Feed post</option><option value="event">Upcoming event</option></select>
              <label>Title</label>
              <input id="titleInput" required />
              <label>Date</label>
              <input id="dateInput" placeholder="e.g. 2026-10-20" />
              <label>Location</label>
              <input id="locationInput" />
              <label>Description</label>
              <textarea id="descInput"></textarea>
              <label>Image</label>
              <input id="imageInput" type="file" accept="image/*" />
              <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
                <button class="primary-btn" type="submit" name="action" value="draft">Save as draft</button>
                <button class="secondary-btn" type="button" id="submitReviewBtn">Submit for review</button>
                <button class="secondary-btn" type="button" id="resetFormBtn">Clear</button>
              </div>
              <p id="formFeedback"></p>
            </form>
          </div>
          <div class="panel">
            <h2>Your content</h2>
            <div class="content-list" id="contentList"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script>
      const sessionMessage = document.getElementById('sessionMessage');
      const contentLayout = document.getElementById('contentLayout');
      const contentList = document.getElementById('contentList');
      const formFeedback = document.getElementById('formFeedback');
      let editingId = null;
      let currentImage = '';
      if (new URLSearchParams(window.location.search).get('embed') === '1') document.body.classList.add('embed');

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function ensureSession() {
        try {
          const res = await fetch('/api/club-auth/session');
          const data = await res.json();
          if (!data.authenticated || !data.club) {
            sessionMessage.textContent = 'Please log in as a club president or head to manage content.';
            return false;
          }
          if (!['president', 'head'].includes(data.club.role)) {
            sessionMessage.textContent = 'This account is for a committee dashboard. Open the right dashboard instead.';
            return false;
          }
          document.getElementById('studioTitle').textContent = `${data.club.name} — Content Studio`;
          contentLayout.hidden = false;
          return true;
        } catch {
          sessionMessage.textContent = 'Could not check your session.';
          return false;
        }
      }

      async function loadContent() {
        try {
          const res = await fetch('/api/club/content');
          const items = await res.json();
          if (!res.ok) throw new Error(items.message || 'Could not load');
          contentList.innerHTML = items.map((item) => `
            <article class="content-card">
              ${item.image ? `<img src="${item.image}" alt="" />` : ''}
              <div style="flex:1">
                <strong>${item.title}</strong>
                <div class="meta">${item.type} · ${item.date || 'no date'} · ${item.location || ''}</div>
                <div><span class="status-badge status-${item.status}">${item.status.replace('_', ' ')}</span></div>
                ${item.comments?.english || item.comments?.pr || item.comments?.dean ? `<div class="meta">Comment: ${item.comments.dean || item.comments.english || item.comments.pr}</div>` : ''}
                <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
                  ${['draft','changes_requested','rejected'].includes(item.status) ? `<button class="mini-btn" data-edit="${item.id}">Edit</button><button class="mini-btn" data-submit="${item.id}">Submit</button>` : ''}
                  <button class="mini-btn" data-delete="${item.id}">Delete</button>
                </div>
              </div>
            </article>
          `).join('') || '<p>No content yet.</p>';
          contentList.querySelectorAll('[data-edit]').forEach((btn) => btn.addEventListener('click', () => startEdit(Number(btn.dataset.edit))));
          contentList.querySelectorAll('[data-delete]').forEach((btn) => btn.addEventListener('click', () => deleteContent(Number(btn.dataset.delete))));
          contentList.querySelectorAll('[data-submit]').forEach((btn) => btn.addEventListener('click', () => submitExisting(Number(btn.dataset.submit))));
        } catch (error) {
          contentList.innerHTML = `<p>${error.message}</p>`;
        }
      }

      async function startEdit(id) {
        const res = await fetch('/api/club/content');
        const items = await res.json();
        const item = items.find((entry) => entry.id === id);
        if (!item) return;
        editingId = id;
        document.getElementById('formTitle').textContent = 'Edit content';
        document.getElementById('typeInput').value = item.type;
        document.getElementById('titleInput').value = item.title;
        document.getElementById('dateInput').value = item.date || '';
        document.getElementById('locationInput').value = item.location || '';
        document.getElementById('descInput').value = item.description || '';
        currentImage = item.image || '';
      }

      async function deleteContent(id) {
        if (!confirm('Delete this content?')) return;
        await fetch(`/api/club/content/${id}`, { method: 'DELETE' });
        await loadContent();
      }

      async function submitExisting(id) {
        const res = await fetch('/api/club/content');
        const items = await res.json();
        const item = items.find((entry) => entry.id === id);
        if (!item) return;
        await fetch(`/api/club/content/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ submit: true, type: item.type }) });
        await loadContent();
      }

      document.getElementById('resetFormBtn').addEventListener('click', () => {
        editingId = null; currentImage = '';
        document.getElementById('formTitle').textContent = 'New post / event';
        document.getElementById('contentForm').reset();
      });

      document.getElementById('imageInput').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (file) currentImage = await fileToDataUrl(file);
      });

      document.getElementById('submitReviewBtn').addEventListener('click', async (event) => {
        event.preventDefault();
        await saveContent(true);
      });

      document.getElementById('contentForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        await saveContent(false);
      });

      async function saveContent(submit) {
        formFeedback.textContent = '';
        const payload = {
          type: document.getElementById('typeInput').value,
          title: document.getElementById('titleInput').value,
          date: document.getElementById('dateInput').value,
          location: document.getElementById('locationInput').value,
          description: document.getElementById('descInput').value,
          image: currentImage,
          submit
        };
        const url = editingId ? `/api/club/content/${editingId}` : '/api/club/content';
        const method = editingId ? 'PUT' : 'POST';
        try {
          const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const result = await res.json();
          if (!res.ok) throw new Error(result.message || 'Save failed');
          formFeedback.textContent = submit ? 'Submitted for review.' : 'Saved as draft.';
          editingId = null; currentImage = '';
          document.getElementById('contentForm').reset();
          document.getElementById('formTitle').textContent = 'New post / event';
          await loadContent();
        } catch (error) {
          formFeedback.textContent = error.message;
        }
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/club-auth/logout', { method: 'POST' });
        window.location.href = '/';
      });

      (async () => {
        if (await ensureSession()) await loadContent();
      })();
    </script>
      <script src="/assets/js/layout.js?v=5" defer></script>
  </body>
</html>
