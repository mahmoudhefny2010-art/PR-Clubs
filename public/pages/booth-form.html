<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/js/site-loading.js?v=20261011scrolltop2"></script>
    <title>Booth Studio</title>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" /></noscript>
    <link rel="stylesheet" href="/assets/css/base.css?v=20261010loading2" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261010navpolish1" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261009c" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261005i" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/pages/content-form.css?v=20261010pickers4" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="app-container">
      <section class="committee-card">
        <div class="committee-top">
          <div>
            <div class="committee-label">BOOTH MODULE</div>
            <h2 id="studioTitle">Booth Studio</h2>
          </div>
          <div class="top-actions">
            <a class="secondary-btn" href="/" data-history-back>Back</a>
            <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
          </div>
        </div>
        <nav class="module-nav" aria-label="Content modules">
          <a href="/pages/event-form.html">Events</a>
          <a href="/pages/feed-form.html">Feed</a>
          <a href="/pages/sponsor-form.html">Sponsors</a>
          <a href="/pages/booth-form.html" class="is-active">Booths</a>
          <a href="/pages/club-content.html">All content</a>
        </nav>
        <p id="sessionMessage"></p>
        <div class="content-layout" id="contentLayout" hidden>
          <div class="panel">
            <h2 id="formTitle">New booth request</h2>
            <form id="contentForm">
              <label>Booth Name</label>
              <input id="boothNameInput" required />
              <label>Booth Purpose</label>
              <textarea id="boothPurposeInput"></textarea>
              <label>Description</label>
              <textarea id="boothDescInput"></textarea>
              <label>Preferred Location</label>
              <input id="boothLocationInput" placeholder="e.g. Main hall, Gate area" />
              <label>Booth Size</label>
              <input id="boothSizeInput" type="text" placeholder="e.g. 3x3 meters" />
              <label>Required Equipment</label>
              <textarea id="boothEquipmentInput" placeholder="List required equipment"></textarea>
              <label for="boothSetupDateInput">Setup Date</label>
              <input id="boothSetupDateInput" type="date" />
              <label for="boothOpenDateInput">Opening Date</label>
              <input id="boothOpenDateInput" type="date" />
              <label for="boothCloseDateInput">Closing Date</label>
              <input id="boothCloseDateInput" type="date" />
              <label>Contact Person</label>
              <input id="boothContactInput" />
              <label>Additional Notes</label>
              <textarea id="boothNotesInput"></textarea>
              <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
                <button class="primary-btn" type="submit" name="action" value="draft">Save as draft</button>
                <button class="secondary-btn" type="button" id="submitReviewBtn">Submit for review</button>
                <button class="secondary-btn" type="button" id="resetFormBtn">Clear</button>
              </div>
              <p id="formFeedback"></p>
            </form>
          </div>
          <div class="panel">
            <h2>Your booths</h2>
            <div class="content-list" id="contentList"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="/assets/js/content-studio.js?v=20261010headassignment1"></script>
    <script src="/assets/js/date-time-picker.js?v=20261010pickers1"></script>
    <script src="/assets/js/pages/booth-form.js?v=1"></script>
    <script src="/assets/js/layout.js?v=20261010passwordeye1" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
