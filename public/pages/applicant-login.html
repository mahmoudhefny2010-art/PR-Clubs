<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIU Student Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css?v=20261007d" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005h" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261009c" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261008g" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
    <style>
      .login-wrap { max-width: 440px; margin: 40px auto; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 36px 32px; box-shadow: var(--shadow-xl); }
      .login-wrap img { display: block; width: 120px; height: 120px; object-fit: contain; border-radius: 50%; margin: 0 auto 8px; }
      .login-wrap h1 { text-align: center; font-size: 1.5rem; margin: 0 0 6px; font-weight: 800; }
      .login-wrap p.sub { text-align: center; color: var(--text-muted); margin: 0 0 24px; font-size: .92rem; }
      .login-divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--text-light); font-size: .8rem; font-weight: 700; }
      .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
      .google-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--bg-panel); border: 1px solid var(--border-color); padding: 12px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; color: var(--text-main); transition: all var(--transition-fast); }
      .google-btn:hover { background: var(--slate-100); }
      .google-btn svg { width: 18px; height: 18px; }
      .login-foot { text-align: center; margin-top: 20px; font-size: .88rem; color: var(--text-muted); }
      .login-foot a { color: var(--primary-700); font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div id="site-header"></div>

      <main class="app-container">
        <div class="login-wrap">
          <img src="/assets/img/pics/logo.svg.png" alt="MIU logo" />
          <h1>Student Sign In</h1>
          <p class="sub">Sign in with your university or club account.</p>
          <form id="studentLoginForm">
            <div class="field-group">
              <label for="uniId">Email</label>
              <input id="uniId" type="email" placeholder="name@miuegypt.edu.eg" autocomplete="username" required />
            </div>
            <div class="field-group">
              <label for="uniPassword">Password</label>
              <input id="uniPassword" type="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
            <button class="primary-btn" type="submit" style="width:100%">Sign In</button>
          </form>
          <p class="login-foot" style="text-align:right;margin-top:10px"><a href="/pages/forgot-password.html">Forgot password?</a></p>
          <p id="loginFeedback" class="admin-feedback" aria-live="polite"></p>
          <div id="googleLoginArea">
            <div class="login-divider">OR</div>
            <div id="googleLoginButton"></div>
            <button id="googleUnavailableButton" class="google-btn" type="button" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29C5.02 13.57 4.89 12.8 4.89 12s.13-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
              Sign in with Google
            </button>
            <p id="googleLoginFeedback" class="admin-feedback" aria-live="polite"></p>
          </div>
          <p class="login-foot">Back to homepage? <a href="/">Click here</a></p>
        </div>
      </main>
    </div>

    <div id="site-footer"></div>
    <script>
      document.getElementById('studentLoginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const feedback = document.getElementById('loginFeedback');
        feedback.textContent = '';
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('uniId').value.trim(),
              password: document.getElementById('uniPassword').value,
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || 'Login failed.');
          window.location.assign(result.role === 'student' ? studentReturnTarget() : (result.redirect || '/'));
        } catch (error) {
          feedback.textContent = error.message;
          feedback.classList.add('is-error');
        }
      });
      const studentReturnTarget = () => {
        const target = new URLSearchParams(window.location.search).get('redirect') || '/';
        try {
          const parsed = new URL(target, window.location.origin);
          return target.startsWith('/') && parsed.origin === window.location.origin
            ? `${parsed.pathname}${parsed.search}${parsed.hash}`
            : '/';
        } catch { return '/'; }
      };
      async function configureGoogleSignIn() {
        const area = document.getElementById('googleLoginArea');
        const fallbackButton = document.getElementById('googleUnavailableButton');
        try {
          const configResponse = await fetch('/api/student-auth/google-config', { cache: 'no-store' });
          const config = await configResponse.json();
          if (!configResponse.ok || !config.enabled) {
            fallbackButton.hidden = false;
            return;
          }
          const script = document.createElement('script');
          script.src = 'https://accounts.google.com/gsi/client';
          script.async = true;
          script.onload = () => {
            if (!window.google?.accounts?.id) {
              fallbackButton.hidden = false;
              return;
            }
            window.google.accounts.id.initialize({
              client_id: config.clientId,
              nonce: config.nonce,
              hd: 'miuegypt.edu.eg',
              callback: async (credentialResponse) => {
                const feedback = document.getElementById('googleLoginFeedback');
                feedback.textContent = 'Checking your MIU Google account...';
                try {
                  const response = await fetch('/api/student-auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: credentialResponse.credential }) });
                  const result = await response.json();
                  if (!response.ok) throw new Error(result.message || 'Google sign-in failed.');
                  window.location.assign(studentReturnTarget());
                } catch (error) { feedback.textContent = error.message; feedback.classList.add('is-error'); }
              }
            });
            window.google.accounts.id.renderButton(document.getElementById('googleLoginButton'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 360 });
            area.classList.remove('hidden');
          };
          script.onerror = () => { fallbackButton.hidden = false; area.classList.remove('hidden'); };
          document.head.append(script);
        } catch {
          fallbackButton.hidden = false;
        }
      }
      configureGoogleSignIn();
      document.getElementById('googleUnavailableButton').addEventListener('click', () => {
        const feedback = document.getElementById('googleLoginFeedback');
        feedback.textContent = 'Google sign-in is not configured yet. Ask the site administrator to enable it.';
        feedback.classList.add('is-error');
      });
    </script>
    <script src="/assets/js/layout.js?v=11" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
