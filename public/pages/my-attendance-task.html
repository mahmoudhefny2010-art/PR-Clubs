<body><div id="site-header"></div><main class="app-container event-reports"><section class="committee-card"><h1>Attendance usher task</h1><p id="usherTaskMessage" role="status" aria-live="polite">Loading your task…</p><section id="usherTask" hidden><h2 id="usherTaskTitle"></h2><p id="usherTaskDate"></p><div id="usherTaskActions"><button id="acceptUsherTask" class="primary-btn" type="button">Accept task</button><button id="openUsherQr" class="primary-btn" type="button" hidden>Open attendance QR</button></div><p id="usherAttendanceStatus" role="status"></p>
