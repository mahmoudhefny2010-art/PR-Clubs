    <title>Sponsor Studio</title>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />

</head>
  <body>
    <div id="site-header"></div>
    <main class="app-container">
      <section class="committee-card">
        <div class="committee-top">
          <div>
            <div class="committee-label">SPONSOR MODULE</div>
            <h2 id="studioTitle">Sponsor Studio</h2>
          </div>
          <div class="top-actions">
            <a class="secondary-btn" href="/" data-history-back>Back</a>
          </div>
        </div>
        <nav class="module-nav" aria-label="Content modules">
          <a href="/pages/event-form.html">Events</a>
          <a href="/pages/feed-form.html">Feed</a>
          <a href="/pages/sponsor-form.html" class="is-active">Sponsors</a>
          <a href="/pages/booth-form.html">Booths</a>
          <a href="/pages/club-content.html">All content</a>
        </nav>
        <p id="sessionMessage"></p>
        <div class="content-layout" id="contentLayout" hidden>
          <div class="panel">
            <h2 id="formTitle">New sponsor request</h2>
            <form id="contentForm">
              <label>Sponsor Name</label>
              <input id="sponsorNameInput" required />
              <label>Company Name</label>
              <input id="sponsorCompanyInput" />
              <label>Contact Person</label>
              <input id="sponsorContactInput" />
              <label>Email</label>
              <input id="sponsorEmailInput" type="email" />
              <label>Phone Number</label>
              <input id="sponsorPhoneInput" type="tel" />
              <label>Sponsorship Type</label>
              <select id="sponsorTypeInput">
                <option value="bronze">Bronze</option>
                <option value="silver">Silver</option>
                <option value="gold">Gold</option>
                <option value="platinum">Platinum</option>
              </select>
              <label>Sponsorship Amount/Value</label>
              <input id="sponsorAmountInput" type="text" placeholder="e.g. 50,000 EGP" />
              <label>Sponsorship Benefits</label>
              <textarea id="sponsorBenefitsInput" placeholder="What benefits will the sponsor receive?"></textarea>
              <label>Description</label>
              <textarea id="sponsorDescInput"></textarea>
              <label>Company Logo (required for review)</label>
              <input id="sponsorLogoInput" type="file" accept="image/*" />
              <small class="meta">Sponsors published on the website need a company logo. Drafts can be saved without one.</small>
              <label>Attachment/Agreement (optional)</label>
              <input id="sponsorAttachmentInput" type="file" />
              <label>Additional Notes</label>
              <textarea id="sponsorNotesInput"></textarea>
              <div class="content-form-actions">
                <button class="primary-btn" type="submit" name="action" value="draft">Save as draft</button>
                <button class="secondary-btn" type="button" id="submitReviewBtn">Submit for review</button>
                <button class="secondary-btn" type="button" id="resetFormBtn">Clear</button>
              </div>
              <p id="formFeedback"></p>
            </form>
          </div>
          <div class="panel">
            <h2>Your sponsors</h2>
            <div class="content-list" id="contentList"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="/assets/js/content-studio.js?v=20261014reviewcolors2"></script>
    <script src="/assets/js/pages/sponsor-form.js?v=1"></script>
    <script src="/assets/js/layout.js?v=20261014promptqueue1" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
