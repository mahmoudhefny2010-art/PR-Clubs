<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css?v=20261007d" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005i" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261009c" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261005i" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
    <style>
      .content-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
      @media (max-width: 900px) { .content-layout { grid-template-columns: 1fr; } }
      .panel { background: #fff; border: 1px solid #f0d7d7; border-radius: 18px; padding: 18px; }
      .panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
      .panel label { display: block; font-weight: 700; font-size: .82rem; margin: 10px 0 4px; }
      .panel input, .panel select, .panel textarea { width: 100%; padding: 10px 12px; border: 1px solid #e5cfd0; border-radius: 10px; font: inherit; }
      .panel textarea { min-height: 90px; }
      .content-list { display: flex; flex-direction: column; gap: 12px; }
      .content-card { border: 1px solid #eee; border-radius: 14px; padding: 12px; display: flex; gap: 12px; }
      .content-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; }
      .content-card .meta { font-size: .8rem; color: #6b7280; }
      .status-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 800; text-transform: uppercase; }
      .status-draft { background: #f3f4f6; color: #374151; }
      .status-pending_pr, .status-pending_english, .status-pending_dean { background: #fff1d5; color: #92400e; }
      .status-changes_requested { background: #fde8e8; color: #b71c1c; }
      .status-rejected { background: #fee2e2; color: #991b1b; }
      .status-published { background: #dcfce7; color: #166534; }
      body.embed .topbar { display: none; }
      body.embed .app-container { max-width: 100%; margin: 0; padding: 0; }
      body.embed #site-header,
      body.embed #site-footer,
      body.embed .site-footer { display: none !important; }
      body.embed { background: transparent; }
      body.embed .page-shell { padding: 0; }
      .mini-btn { padding: 4px 10px; border-radius: 999px; border: 1px solid #ddd; background: #fff; font-weight: 700; cursor: pointer; font-size: .75rem; }
      .type-badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .68rem; font-weight: 800; text-transform: uppercase; margin-right: 8px; }
      .type-event { background: #dbeafe; color: #1d4ed8; }
      .type-feed { background: #ede9fe; color: #6d28d9; }
      .type-sponsor { background: #fef3c7; color: #92400e; }
      .type-booth { background: #d1fae5; color: #065f46; }
      .content-card-type { width: 70px; height: 70px; flex: 0 0 70px; border-radius: 12px; background: #f3f4f6; color: #6b7280; font-size: .66rem; font-weight: 800; display: flex; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: .04em; text-align: center; }
      .module-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
      .module-nav a { padding: 6px 14px; border-radius: 999px; border: 1px solid #e5cfd0; background: #fff; color: #111; font-weight: 700; font-size: .82rem; text-decoration: none; }
      .module-nav a.is-active { background: #b71c1c; border-color: #b71c1c; color: #fff; }
    </style>
  </head>
  <body>
    <div id="site-header"></div>
    <main class="app-container">
      <section class="committee-card">
        <div class="committee-top">
          <div>
            <div class="committee-label">EVENT MODULE</div>
            <h2 id="studioTitle">Event Studio</h2>
          </div>
          <div class="top-actions">
            <a class="secondary-btn" href="/" data-history-back>Back</a>
            <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
          </div>
        </div>
        <nav class="module-nav" aria-label="Content modules">
          <a href="/pages/event-form.html" class="is-active">Events</a>
          <a href="/pages/feed-form.html">Feed</a>
          <a href="/pages/sponsor-form.html">Sponsors</a>
          <a href="/pages/booth-form.html">Booths</a>
          <a href="/pages/club-content.html">All content</a>
        </nav>
        <p id="sessionMessage"></p>
        <div class="content-layout" id="contentLayout" hidden>
          <div class="panel">
            <h2 id="formTitle">New event</h2>
            <form id="contentForm">
              <label>Title</label>
              <input id="titleInput" required />
              <label>Date</label>
              <input id="dateInput" type="date" aria-describedby="dateHint" />
              <small id="dateHint" class="meta">Choose a date. The saved format is YYYY-MM-DD, for example 2026-10-20.</small>
              <label>Time</label>
              <input id="timeInput" type="time" />
              <label>Location</label>
              <input id="locationInput" />
              <label>Budget</label>
              <input id="budgetInput" type="text" placeholder="Optional" />
              <label>Description</label>
              <textarea id="descInput"></textarea>
              <label>Image</label>
              <input id="imageInput" type="file" accept="image/*" />
              <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
                <button class="primary-btn" type="submit" name="action" value="draft">Save as draft</button>
                <button class="secondary-btn" type="button" id="submitReviewBtn">Submit for review</button>
                <button class="secondary-btn" type="button" id="resetFormBtn">Clear</button>
              </div>
              <p id="formFeedback"></p>
            </form>
          </div>
          <div class="panel">
            <h2>Your events</h2>
            <div class="content-list" id="contentList"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="/assets/js/content-studio.js?v=20261007c"></script>
    <script>
      let currentImage = '';
      const imageInput = document.getElementById('imageInput');
      imageInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (file) currentImage = await ContentStudio.fileToDataUrl(file);
      });

      ContentStudio.init({
        type: 'event',
        pageTitle: 'Event Studio',
        formTitle: 'New event',
        collect: () => ({
          title: document.getElementById('titleInput').value,
          date: document.getElementById('dateInput').value,
          time: document.getElementById('timeInput').value,
          location: document.getElementById('locationInput').value,
          budget: document.getElementById('budgetInput').value,
          description: document.getElementById('descInput').value,
          image: currentImage
        }),
        fill: (item) => {
          document.getElementById('titleInput').value = item.title || '';
          document.getElementById('dateInput').value = item.date || '';
          document.getElementById('timeInput').value = item.time || '';
          document.getElementById('locationInput').value = item.location || '';
          document.getElementById('budgetInput').value = item.budget || '';
          document.getElementById('descInput').value = item.description || '';
          currentImage = item.image || '';
        },
        resetExtras: () => {
          currentImage = '';
          imageInput.value = '';
        }
      });
    </script>
    <script src="/assets/js/layout.js?v=11" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
