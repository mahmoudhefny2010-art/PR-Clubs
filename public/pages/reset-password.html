<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/js/site-loading.js?v=1"></script>
    <meta name="referrer" content="no-referrer" />
    <title>Reset Password — MIU Student Club Portal</title>
    <link rel="stylesheet" href="/assets/css/base.css?v=20261010loading1" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261010navpolish1" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261009c" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261005h" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/pages/password-recovery.css?v=1" />
  </head>
  <body>
    <div class="page-shell">
      <div id="site-header"></div>
      <main class="app-container">
        <section class="recovery-wrap" aria-labelledby="resetTitle">
          <span class="admin-eyebrow">ACCOUNT RECOVERY</span>
          <h1 id="resetTitle">Reset Password</h1>
          <p id="resetIntro">Choose a new password for your account.</p>
          <form id="resetPasswordForm" novalidate>
            <div class="field-group">
              <label for="newPassword">New Password</label>
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required />
            </div>
            <div class="field-group">
              <label for="confirmNewPassword">Confirm New Password</label>
              <input id="confirmNewPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required />
            </div>
            <div class="recovery-actions">
              <button class="primary-btn" id="resetPasswordBtn" type="submit">Reset Password</button>
            </div>
          </form>
          <p id="resetPasswordFeedback" class="admin-feedback recovery-feedback" aria-live="polite"></p>
          <a class="text-button recovery-back" href="/pages/forgot-password.html">Request a new reset link</a>
          <a id="resetBackToLogin" class="text-button recovery-back hidden" href="/pages/applicant-login.html">Go to Login</a>
        </section>
      </main>
    </div>
    <div id="site-footer"></div>
    <script src="/assets/js/pages/reset-password.js?v=1"></script>
    <script src="/assets/js/layout.js?v=20261010account1" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
