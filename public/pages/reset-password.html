<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset Password — MIU Student Club Portal</title>
    <link rel="stylesheet" href="/assets/css/base.css?v=20261007d" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005h" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261009c" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261005h" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png" />
    <style>
      .recovery-wrap { max-width: 460px; margin: 48px auto; padding: 32px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); }
      .recovery-wrap h1 { margin: 0 0 8px; font-size: 1.7rem; }
      .recovery-wrap > p { color: var(--text-muted); line-height: 1.6; }
      .recovery-actions { display: grid; gap: 12px; margin-top: 18px; }
      .recovery-feedback { min-height: 24px; margin: 16px 0 0; }
      .recovery-back { display: inline-block; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div id="site-header"></div>
      <main class="app-container">
        <section class="recovery-wrap" aria-labelledby="resetTitle">
          <span class="admin-eyebrow">ACCOUNT RECOVERY</span>
          <h1 id="resetTitle">Reset Password</h1>
          <p id="resetIntro">Choose a new password for your account.</p>
          <form id="resetPasswordForm" novalidate>
            <div class="field-group">
              <label for="newPassword">New Password</label>
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required />
            </div>
            <div class="field-group">
              <label for="confirmNewPassword">Confirm New Password</label>
              <input id="confirmNewPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required />
            </div>
            <div class="recovery-actions">
              <button class="primary-btn" id="resetPasswordBtn" type="submit">Reset Password</button>
            </div>
          </form>
          <p id="resetPasswordFeedback" class="admin-feedback recovery-feedback" aria-live="polite"></p>
          <a class="text-button recovery-back" href="/pages/forgot-password.html">Request a new reset link</a>
          <a id="resetBackToLogin" class="text-button recovery-back hidden" href="/pages/applicant-login.html">Go to Login</a>
        </section>
      </main>
    </div>
    <div id="site-footer"></div>
    <script>
      const resetUrl = new URL(window.location.href);
      const resetToken = resetUrl.searchParams.get('token') || '';
      window.history.replaceState(null, '', window.location.pathname);
      const resetForm = document.getElementById('resetPasswordForm');
      const resetFeedback = document.getElementById('resetPasswordFeedback');
      const resetButton = document.getElementById('resetPasswordBtn');
      const goToLogin = document.getElementById('resetBackToLogin');
      if (!resetToken) {
        resetForm.hidden = true;
        resetFeedback.textContent = 'This password reset link is no longer valid. Please request a new one.';
        resetFeedback.classList.add('is-error');
      }
      resetForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        resetFeedback.textContent = '';
        resetFeedback.classList.remove('is-error');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmNewPassword');
        if (!newPassword.checkValidity()) {
          newPassword.reportValidity();
          return;
        }
        if (newPassword.value !== confirmPassword.value) {
          resetFeedback.textContent = 'Passwords do not match.';
          resetFeedback.classList.add('is-error');
          confirmPassword.focus();
          return;
        }
        resetButton.disabled = true;
        try {
          const response = await fetch('/api/password-reset/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, newPassword: newPassword.value, confirmPassword: confirmPassword.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || 'Could not reset the password.');
          resetForm.hidden = true;
          document.getElementById('resetIntro').textContent = result.message;
          goToLogin.classList.remove('hidden');
        } catch (error) {
          resetFeedback.textContent = error.message;
          resetFeedback.classList.add('is-error');
        } finally {
          resetButton.disabled = false;
        }
      });
    </script>
    <script src="/assets/js/layout.js?v=11" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
