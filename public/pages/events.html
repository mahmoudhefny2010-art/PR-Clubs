<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events - MIU Clubs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css?v=20261010navpolish1" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261010navpolish1" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261009c" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261008g" />
    <link rel="stylesheet" href="/assets/css/event-modal.css?v=2" />
    <link rel="stylesheet" href="/assets/css/pages/events.css?v=10" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
  </head>
  <body>
    <div class="page-shell">
      <div id="site-header"></div>

      <main class="app-container">
        <section class="events-page">
          <div class="welcome-box hero-panel">
            <h1>Upcoming Events &amp; News</h1>
            <p>Discover every club event and announcement in one place. Register directly or explore details.</p>
            <div class="home-form-actions">
              <a class="secondary-btn" href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg>
                <span>Back to clubs</span>
              </a>
            </div>
          </div>

          <div id="eventsList" class="events-timeline"></div>

          <section id="feedTimelineSection" class="feed-timeline-section" hidden>
            <div class="feed-timeline-head">
              <h2>Latest Club Updates</h2>
            </div>
            <div id="feedTimeline" class="feed-timeline"></div>
          </section>
        </section>
      </main>
    </div>

    <div id="site-footer"></div>

    <div class="event-modal hidden" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
      <article class="event-modal-panel">
        <button id="eventModalClose" class="calendar-close-btn event-modal-close" type="button" aria-label="Close event">&times;</button>
        <img id="eventModalImage" class="event-modal-image" src="" alt="" />
        <div class="event-modal-copy">
          <span id="eventModalClub" class="event-modal-club"></span>
          <h2 id="eventModalTitle"></h2>
          <p id="eventModalMeta" class="event-modal-meta"></p>
          <p id="eventModalDescription" class="event-modal-description"></p>
          <form id="eventModalForm">
            <div class="field-group">
              <label for="eventModalName">Your Name</label>
              <input id="eventModalName" placeholder="Full name" required />
            </div>
            <div class="field-group">
              <label for="eventModalEmail">University Email</label>
              <input id="eventModalEmail" type="email" placeholder="example@miuegypt.edu.eg" required />
            </div>
            <button class="primary-btn" type="submit">Register for event</button>
          </form>
          <p id="eventModalFeedback" class="admin-feedback" aria-live="polite"></p>
        </div>
      </article>
    </div>

    <script src="/assets/js/event-modal.js?v=2"></script>
    <script src="/assets/js/pages/events.js?v=11"></script>
    <script src="/assets/js/layout.js?v=20261010navpolish1" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
