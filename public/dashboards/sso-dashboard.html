<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Student Support Office | Attendance Reviews</title>
    <link rel="stylesheet" href="/assets/css/base.css?v=20261009e" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261009b" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261009c" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261009au" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png" />
    <style>
      .sso-page { flex: 1 0 auto; width: min(100%, 1192px); padding: 32px 16px 52px; }
      .sso-hero { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:24px; margin-bottom:22px; border:1px solid var(--border-color); border-radius:16px; background:var(--bg-panel); }
      .sso-hero h1 { margin:4px 0; }
      .sso-hero p { margin:0; color:var(--text-muted); }
      .attendance-review-panel { margin-top:0; }
    </style>
  </head>
  <body>
    <div id="site-header"></div>
    <main class="sso-page committee-dashboard-layout">
      <aside class="committee-sidebar" data-unread-scope="sso" aria-label="SSO dashboard navigation">
        <h2>DASHBOARD</h2><a class="committee-sidebar-link is-active" href="#ssoOverviewPanel" data-dashboard-panel="ssoOverviewPanel">Overview</a>
        <h3>ATTENDANCE</h3><button id="openAttendanceReviewBtn" class="committee-sidebar-link" data-dashboard-panel="attendanceReviewDialog" type="button">Attendance approvals <span class="sidebar-unread-badge" data-unread-badge="attendanceApprovals" hidden></span></button>
      </aside>
      <div class="sso-content">
      <section id="ssoOverviewPanel" class="sso-hero committee-overview-panel">
        <div><span class="committee-label">STUDENT SUPPORT OFFICE</span><h1>Overview</h1><p>Attendance approved by PR and waiting for SSO review.</p><div class="committee-overview-stats overview-grid-1"><button class="overview-stat-card" type="button" id="overviewReviewsBtn"><span>Pending SSO reviews</span><strong data-overview-count="attendanceApprovals">—</strong><small>Open attendance approval queue</small></button></div></div>
        <div class="top-actions"><a class="secondary-btn" href="/">Back</a><button id="ssoLogoutBtn" class="logout-btn" type="button">Logout</button></div>
      </section>

      </div>
    </main>
    <dialog id="attendanceReviewDialog" class="attendance-review-dialog" aria-labelledby="attendanceReviewTitle">
      <section class="attendance-review-panel"><header><div><span class="committee-label">PR APPROVED</span><h2 id="attendanceReviewTitle">Pending SSO review</h2><p>Approve the attendance records to send them to the Dean.</p></div><div class="attendance-review-actions"><button class="secondary-btn" type="button" data-refresh-attendance-reviews>Refresh</button><button class="calendar-close-btn" type="button" data-close-attendance-reviews aria-label="Close attendance reviews">&times;</button></div></header><p data-attendance-review-message role="status" aria-live="polite"></p><div data-attendance-review-list></div></section>
    </dialog>
    <div id="site-footer"></div>
    <script src="/assets/js/committee-sidebar.js?v=13"></script>
    <script src="/assets/js/attendance-approval-workflow.js?v=9"></script>
    <script src="/assets/js/layout.js?v=11" defer></script>
    <script src="/assets/js/theme.js?v=20261009c" defer></script>
  </body>
</html>
