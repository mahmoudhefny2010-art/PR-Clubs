<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Committee Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css?v=20261005g" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005g" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261005g" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261005g" />
    <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
    <style>
      .app-container { flex: 1 0 auto; width: min(100%, 1192px); padding: 32px 16px 52px; }
      .committee-top > .top-actions { margin-left: auto; justify-content: flex-end; }
      .req-card { border: 1px solid #eee; border-radius: 16px; padding: 14px; display: flex; gap: 14px; margin-bottom: 12px; background: #fff; }
      .req-card img { width: 90px; height: 90px; object-fit: cover; border-radius: 12px; }
      .req-meta { font-size: .82rem; color: #6b7280; }
      .badge-status { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #fff1d5; color: #92400e; font-size: .7rem; font-weight: 800; text-transform: uppercase; }
      .req-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
      .req-actions button, .req-actions input { padding: 6px 12px; border-radius: 999px; border: 1px solid #ddd; background: #fff; font-weight: 700; cursor: pointer; font-size: .8rem; }
      .req-actions .approve { background: #dcfce7; border-color: #86efac; color: #166534; }
      .req-actions .reject { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
      .req-actions .changes { background: #fff1d5; border-color: #fcd34d; color: #92400e; }
      .req-actions .delete { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
      .req-actions .view-details { display: inline-flex; align-items: center; gap: 6px; }
      .req-actions .view-details svg { width: 15px; height: 15px; }
      .request-dialog { width: min(680px, calc(100% - 28px)); max-height: min(82vh, 800px); padding: 0; border: 0; border-radius: 20px; box-shadow: 0 24px 80px #0004; }
      .request-dialog::backdrop { background: #1119; backdrop-filter: blur(3px); }
      .request-dialog-inner { padding: 24px; }
      .request-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      .request-dialog-head h2 { margin: 0; }
      .request-dialog-close { border: 0; border-radius: 50%; width: 38px; height: 38px; background: #f3f4f6; font-size: 1.3rem; cursor: pointer; }
      .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 20px 0; }
      .detail-item { min-width: 0; padding: 12px; border: 1px solid #eee; border-radius: 12px; }
      .detail-item h3 { margin: 0 0 6px; font-size: .75rem; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
      .detail-item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .detail-wide { grid-column: 1 / -1; }
      .detail-attachment { display: block; max-width: 100%; max-height: 280px; margin-top: 10px; border-radius: 12px; object-fit: contain; }
      .dialog-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      .dialog-actions button { border: 1px solid #ddd; border-radius: 999px; padding: 10px 16px; background: #fff; font-weight: 800; cursor: pointer; }
      .dialog-actions .approve { background: #dcfce7; border-color: #86efac; color: #166534; }
      .dialog-actions .reject { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
      .dialog-actions .changes { background: #fff1d5; border-color: #fcd34d; color: #92400e; }
      .dialog-actions .reopen-review { background: #eef2ff; border-color: #a5b4fc; color: #3730a3; }
      .dialog-actions .return-review { background: #fff1d5; border-color: #fcd34d; color: #92400e; }
      .dialog-actions .delete-request { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
      .status-overview-dialog { width: min(960px, calc(100% - 28px)); max-height: 82vh; padding: 0; border: 0; border-radius: 20px; box-shadow: 0 24px 80px #0004; }
      .status-overview-dialog::backdrop { background: #1119; backdrop-filter: blur(3px); }
      .status-overview-inner { padding: 24px; }
      .status-overview-list { display: grid; gap: 10px; max-height: 60vh; margin-top: 18px; overflow: auto; }
      .status-overview-list .req-card { align-items: center; }
      .status-overview-list .req-actions { flex: 0 0 auto; margin-top: 0; }
      .status-overview-list .req-actions .reopen-review { background: #eef2ff; border-color: #a5b4fc; color: #3730a3; }
      .status-overview-meta { color: #6b7280; font-size: .85rem; margin-top: 4px; }
      .status-overview-pill { display: inline-block; margin-top: 5px; border-radius: 999px; padding: 5px 10px; background: #fff1d5; color: #92400e; font-size: .72rem; font-weight: 800; text-transform: uppercase; }
      .status-overview-pill.published { background: #dcfce7; color: #166534; }
      .status-overview-pill.rejected { background: #fee2e2; color: #991b1b; }
      .status-overview-pill.draft { background: #f3f4f6; color: #4b5563; }
      .review-history-dialog { width: min(900px, calc(100% - 28px)); max-height: 86vh; padding: 0; border: 0; border-radius: 20px; box-shadow: 0 24px 80px #0004; }
      .review-history-dialog::backdrop { background: #1119; backdrop-filter: blur(3px); }
      .review-history-inner { padding: 24px; }
      .review-history-head { position: relative; padding-right: 48px; }
      .review-history-head > div { min-width: 0; }
      .review-history-head #closeReviewHistoryXBtn { position: absolute; top: 0; right: 0; z-index: 2; flex: 0 0 38px; }
      .review-history-list { display: grid; gap: 12px; max-height: 64vh; margin-top: 18px; overflow: auto; }
      .review-history-entry { padding: 14px; border: 1px solid #e5e7eb; border-left: 5px solid #9ca3af; border-radius: 14px; }
      .review-history-entry.approve { border-left-color: #22c55e; }
      .review-history-entry.request_edit { border-left-color: #f59e0b; }
      .review-history-entry.reject { border-left-color: #ef4444; }
      .review-history-entry.resubmitted { border-left-color: #3b82f6; }
      .review-history-entry.comment { border-left-color: #9ca3af; }
      .review-history-entry h3 { margin: 0 0 8px; font-size: 1rem; }
      .review-history-entry p { margin: 5px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .review-history-badge { display: inline-block; margin-left: 7px; padding: 3px 8px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: .68rem; font-weight: 800; text-transform: uppercase; vertical-align: middle; }
      .review-history-badge.request_edit { background: #fff1d5; color: #92400e; }
      .review-history-badge.reject { background: #fee2e2; color: #991b1b; }
      .review-history-badge.resubmitted { background: #dbeafe; color: #1d4ed8; }
      .review-history-badge.comment { background: #f3f4f6; color: #4b5563; }
      .review-committee-links { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
      .review-committee-links button { padding: 3px 8px; border: 1px solid #bfdbfe; border-radius: 999px; background: #eff6ff; color: #1d4ed8; font-size: .68rem; font-weight: 800; cursor: pointer; }
      .review-history-entry.focused-review { outline: 3px solid #93c5fd; outline-offset: 2px; background: #f8fbff; }
      .history-return-panel { margin-top: 14px; padding: 14px; border: 1px solid #bfdbfe; border-radius: 14px; background: #f8fbff; }
      .history-return-panel h3 { margin: 0 0 8px; }
      .history-return-panel textarea { box-sizing: border-box; width: 100%; min-height: 90px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; resize: vertical; }
      @media (max-width: 560px) { .detail-grid { grid-template-columns: 1fr; } .detail-wide { grid-column: auto; } }
    </style>
  </head>
  <body>
    <div id="site-header"></div>
    <main class="app-container">
      <section class="committee-card">
        <div class="committee-top">
          <div>
            <div class="committee-label">APPROVALS COMMITTEE</div>
            <h2 id="committeeTitle">Committee dashboard</h2>
          </div>
          <div class="top-actions">
            <a class="secondary-btn" href="/">Back</a>
            <button id="openStatusOverviewBtn" class="secondary-btn" type="button">All Events Status</button>
            <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
          </div>
        </div>
        <p id="sessionMessage"></p>
        <p id="hintText"></p>
        <div id="requestsList"></div>
      </section>
    </main>
    <dialog id="requestDialog" class="request-dialog" aria-labelledby="detailTitle">
      <div class="request-dialog-inner">
        <div class="request-dialog-head"><div><div class="committee-label">REQUEST DETAILS</div><h2 id="detailTitle"></h2></div></div>
        <div id="requestDetails" class="detail-grid"></div>
        <div class="dialog-actions"><button type="button" id="detailsCancelBtn">Close</button><button id="dialogApproveBtn" class="approve" data-dialog-action="approve">Accept</button><button id="dialogRejectBtn" class="reject" data-dialog-action="reject">Reject</button><button id="requestChangesBtn" class="changes" data-dialog-action="request_edit" hidden>Request Edit</button><button id="reopenRequestBtn" class="reopen-review" type="button" hidden>Restart Review</button><button id="returnToPrBtn" class="return-review" type="button" hidden>Send back to PR</button><button id="returnToEnglishBtn" class="return-review" type="button" hidden>Send back to English</button><button id="deleteRequestBtn" class="delete-request" type="button" hidden>Delete</button></div>
      </div>
    </dialog>
    <dialog id="statusOverviewDialog" class="status-overview-dialog" aria-labelledby="statusOverviewTitle">
      <div class="status-overview-inner">
        <div class="request-dialog-head"><div><div class="committee-label">TRACKING</div><h2 id="statusOverviewTitle">All Events Status</h2></div></div>
        <div id="statusOverviewList" class="status-overview-list" aria-live="polite"></div>
        <div class="dialog-actions"><button type="button" id="closeStatusOverviewBtn">Close</button></div>
      </div>
    </dialog>
    <dialog id="reviewHistoryDialog" class="review-history-dialog" aria-labelledby="reviewHistoryTitle">
      <div class="review-history-inner">
        <div class="request-dialog-head review-history-head"><div><div class="committee-label">FULL REVIEW AUDIT</div><h2 id="reviewHistoryTitle">Review All Edits</h2></div><button type="button" id="closeReviewHistoryXBtn" class="request-dialog-close" aria-label="Close review history" onclick="document.getElementById('reviewHistoryDialog').close()">×</button></div>
        <div id="reviewHistoryList" class="review-history-list" aria-live="polite"></div>
        <section id="historyReturnPanel" class="history-return-panel" hidden>
          <h3 id="historyReturnTitle">Return event to committee</h3>
          <p id="historyReturnHelp">Add a comment explaining why the event is being returned. The club will be notified.</p>
          <textarea id="historyReturnComment" maxlength="2000" placeholder="Explain what needs to be reviewed"></textarea>
          <div class="dialog-actions"><button type="button" id="cancelHistoryReturnBtn">Cancel</button><button type="button" id="submitHistoryReturnBtn" class="return-review">Send back</button></div>
        </section>
        <div class="dialog-actions"><button type="button" id="closeReviewHistoryBtn">Close</button></div>
      </div>
    </dialog>
    <div id="site-footer"></div>
    <script src="/assets/js/committee-dashboard.js?v=20261007m"></script>
      <script src="/assets/js/layout.js?v=7" defer></script>
  </body>
</html>
