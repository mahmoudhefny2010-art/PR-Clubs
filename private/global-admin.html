<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Global Admin</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20261005f" />
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005f" />
  <link rel="stylesheet" href="/assets/css/dark.css?v=20261005f" />
  <link rel="stylesheet" href="/assets/css/features.css?v=20261005f" />
  <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
  <style>
    .section { margin-bottom: 28px; }
    .section-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .section-heading h2 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.6rem); }
    .section-heading p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
    .toolbar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar label { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
    .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-panel); color: var(--text); font: inherit; }
    .records { display: grid; gap: 10px; }
    .record { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
    .record-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .record-title { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .record-meta { color: var(--muted); font-size: .82rem; }
    .record-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .record-actions button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-panel); color: var(--text); cursor: pointer; font-weight: 600; }
    .record-actions button.danger { border-color: var(--red); color: var(--red); }
    .empty { color: var(--muted); text-align: center; padding: 24px; }
    .message { min-height: 1.5em; margin-top: 10px; font-size: .9rem; }
    .message.error { color: var(--red); }
    .committee-label { color: var(--gold); font-weight: 800; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; display: block; }
  </style>
</head>
<body>
  <div class="page-shell">
    <div id="site-header"></div>

    <main class="app-container">
      <section class="welcome-box hero-panel">
        <div>
          <span class="committee-label">GLOBAL ADMIN</span>
          <h1 id="adminTitle">Admin Dashboard</h1>
          <p id="adminSubtitle">Manage clubs, heads, and applications globally.</p>
        </div>
        <div class="top-actions">
          <button id="logoutBtn" class="secondary-btn" type="button">Sign out</button>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <div><h2>Club Heads</h2><p>Add or remove club heads (president/head).</p></div>
          <div class="top-actions">
            <button id="addHeadBtn" class="primary-btn" type="button">Add head</button>
          </div>
        </section>
        <div class="toolbar">
          <label>Filter heads by club<select id="headClubFilter"></select></label>
        </div>
        <div id="headRecords" class="records"></div>
      </section>

      <section class="section">
        <div class="section-heading">
          <div><h2>Applications</h2><p>View and manage applications submitted to any club.</p></div>
        </div>
        <div class="toolbar">
          <label>Filter applications by club<select id="applicationClubFilter"></select></label>
        </div>
        <p id="applicationMessage" class="message" role="status"></p>
        <div id="applicationRecords" class="records"></div>
      </section>
    </main>

    <div id="site-footer"></div>
  </div>

  <script src="/assets/js/layout.js?v=6" defer></script>
  <script src="/assets/js/theme.js?v=20261005f" defer></script>
  <script>
    const clubs = [];
    let heads = [];
    let applications = [];
    const byId = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' })[character]);
    const setMessage = (id, message, isError = false) => { const node = byId(id); node.textContent = message; node.classList.toggle('error', isError); };
    const filterValue = (id) => byId(id).value;
    async function request(url, options) {
      const response = await fetch(url, { cache: 'no-store', ...options });
      if (response.status === 204) return null;
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || 'Request failed.');
      return result;
    }
    function fillClubSelect(select, includeAll) {
      select.replaceChildren();
      if (includeAll) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'All clubs';
        select.appendChild(opt);
      }
      for (const club of clubs) {
        const opt = document.createElement('option');
        opt.value = club.id;
        opt.textContent = club.name;
        select.appendChild(opt);
      }
    }
    function renderHeads() {
      const list = byId('headRecords');
      if (!heads.length) { list.innerHTML = '<p class="empty">No heads added yet.</p>'; return; }
      list.innerHTML = heads.map((head) => {
        const club = clubs.find((c) => Number(c.id) === Number(head.clubId));
        return `
        <div class="record">
          <div class="record-head">
            <div>
              <h3 class="record-title">${escapeHtml(head.name)}</h3>
              <p class="record-meta">${escapeHtml(head.email)} · ${escapeHtml(head.role)} · ${club ? escapeHtml(club.name) : 'Unknown club'}</p>
            </div>
            <div class="record-actions">
              <button type="button" class="danger" data-id="${head.id}">Remove</button>
            </div>
          </div>
        </div>`;
      }).join('');
      list.querySelectorAll('[data-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Remove this head?')) return;
          try {
            await request(`/api/admin/heads/${btn.dataset.id}`, { method: 'DELETE' });
            await reloadHeads();
            setMessage('headMessage', 'Head removed.', false);
          } catch (error) {
            setMessage('headMessage', error.message, true);
          }
        });
      });
    }
    async function reloadHeads() {
      const data = await request('/api/admin/heads');
      heads = Array.isArray(data) ? data : [];
      renderHeads();
    }
    async function reloadApplications() {
      const clubId = filterValue('applicationClubFilter');
      const url = clubId ? `/api/admin/applications?club=${clubId}` : '/api/admin/applications';
      const data = await request(url);
      applications = Array.isArray(data) ? data : [];
      renderApplications();
    }
    function renderApplications() {
      const list = byId('applicationRecords');
      if (!applications.length) { list.innerHTML = '<p class="empty">No applications found.</p>'; return; }
      list.innerHTML = applications.map((app) => `
        <div class="record">
          <div class="record-head">
            <div>
              <h3 class="record-title">${escapeHtml(app.studentName)}</h3>
              <p class="record-meta">${escapeHtml(app.email)} · ${escapeHtml(app.clubName)} · <span class="status-pill status-${app.status}">${escapeHtml(app.status)}</span></p>
            </div>
            <div class="record-actions">
              ${app.status === 'pending' ? `<button type="button" class="primary-btn" data-action="accept" data-id="${app.id}">Accept</button>
              <button type="button" class="secondary-btn" data-action="reject" data-id="${app.id}">Reject</button>` : ''}
            </div>
          </div>
        </div>`).join('');
      list.querySelectorAll('[data-action]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          try {
            await request(`/api/admin/applications/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: action === 'accept' ? 'accepted' : 'rejected' }) });
            await reloadApplications();
            setMessage('applicationMessage', `Application ${action}ed.`, false);
          } catch (error) {
            setMessage('applicationMessage', error.message, true);
          }
        });
      });
    }
    byId('addHeadBtn').addEventListener('click', async () => {
      const name = prompt('Head full name:');
      if (!name) return;
      const email = prompt('Head email (university):');
      if (!email) return;
      const role = prompt('Role (president or head):', 'president');
      if (!role) return;
      const clubId = filterValue('headClubFilter');
      if (!clubId) { alert('Select a club first.'); return; }
      try {
        await request('/api/admin/heads', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, role, clubId: Number(clubId) }) });
        await reloadHeads();
        setMessage('headMessage', 'Head added.', false);
      } catch (error) {
        setMessage('headMessage', error.message, true);
      }
    });
    byId('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.assign('/');
    });
    byId('headClubFilter').addEventListener('change', reloadHeads);
    byId('applicationClubFilter').addEventListener('change', reloadApplications);
    async function init() {
      try {
        const [clubData] = await Promise.all([request('/api/clubs'), reloadHeads(), reloadApplications()]);
        clubs.push(...clubData);
        fillClubSelect(byId('headClubFilter'), false);
        fillClubSelect(byId('applicationClubFilter'), true);
      } catch (error) {
        setMessage('headMessage', error.message, true);
        setMessage('applicationMessage', error.message, true);
      }
    }
    init();
  </script>
</body>
</html>
