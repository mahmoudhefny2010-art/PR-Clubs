<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Club account credentials</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20261005g" />
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005g" />
  <link rel="stylesheet" href="/assets/css/dark.css?v=20261005g" />
  <link rel="stylesheet" href="/assets/css/features.css?v=20261005g" />
  <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--bg-main); color: var(--text); }
    * { box-sizing: border-box; }
    .page-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .welcome-box.hero-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    .welcome-box.hero-panel h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
    .welcome-box.hero-panel p { color: var(--muted); margin: 0; }
    .top-actions { margin-top: 16px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-panel); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; color: var(--text); }
    th { color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; }
    tr:last-child td { border-bottom: 0; }
    code { color: var(--text); font-size: .92rem; }
    #status { min-height: 1.5em; margin-top: 12px; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="page-shell">
    <div id="site-header"></div>

    <main class="app-container">
      <section class="welcome-box hero-panel">
        <div>
          <h1>Club account credentials</h1>
          <p>Private administrator view. Keep these login details confidential.</p>
        </div>
        <div class="top-actions">
          <button id="logout" class="secondary-btn" type="button">Sign out</button>
        </div>
      </section>

      <p id="status" role="status">Loading accounts...</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Club</th><th>Email</th><th>Password</th></tr></thead>
          <tbody id="accounts"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="site-footer"></div>

  <script src="/assets/js/layout.js?v=7" defer></script>
  <script src="/assets/js/theme.js?v=20261005g" defer></script>
  <script>
    const status = document.getElementById('status');
    const rows = document.getElementById('accounts');
    fetch('/api/admin/club-credentials', { cache: 'no-store' })
      .then(async (response) => {
        if (!response.ok) throw new Error(response.status === 401 ? 'Admin login required.' : 'Could not load club accounts.');
        return response.json();
      })
      .then((accounts) => {
        for (const account of accounts) {
          const row = document.createElement('tr');
          for (const value of [account.clubName, account.email, account.password || 'Not available']) {
            const cell = document.createElement('td');
            const text = document.createElement(value === account.clubName ? 'span' : 'code');
            text.textContent = value;
            cell.append(text);
            row.append(cell);
          }
          rows.append(row);
        }
        status.textContent = `${accounts.length} club accounts`;
      })
      .catch((error) => { status.textContent = error.message; });
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.assign('/');
    });
  </script>
</body>
</html>
