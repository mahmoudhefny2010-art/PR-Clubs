<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Club account credentials</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20261005d" />
    <link rel="stylesheet" href="/assets/css/responsive.css?v=20261005d" />
    <link rel="stylesheet" href="/assets/css/dark.css?v=20261005d" />
    <link rel="stylesheet" href="/assets/css/features.css?v=20261005d" />
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--bg-main); color: var(--text); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; background: var(--bg-main); color: var(--text); }
    main { max-width: 980px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.2rem); }
    p { color: var(--muted); }
    button { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); background: var(--bg-panel); cursor: pointer; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-panel); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; color: var(--text); }
    th { color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; }
    tr:last-child td { border-bottom: 0; }
    code { color: var(--text); font-size: .92rem; }
    #status { min-height: 1.5em; }
    @media (max-width: 560px) {
      body { padding: 64px 12px 24px; }
      header { align-items: flex-start; flex-direction: column; gap: 10px; }
      th, td { padding: 10px 12px; font-size: .88rem; }
    }
  </style>
  <link rel="icon" href="/assets/img/pics/logo.svg.png" type="image/png">
</head>
<body>
  <main>
    <header><h1>Club account credentials</h1><button id="logout" type="button">Sign out</button></header>
    <p>Private administrator view. Keep these login details confidential.</p>
    <p id="status" role="status">Loading accounts…</p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Club</th><th>Email</th><th>Password</th></tr></thead>
        <tbody id="accounts"></tbody>
      </table>
    </div>
  </main>
    <div id="site-footer"></div>
  <script>
    const status = document.getElementById('status');
    const rows = document.getElementById('accounts');
    fetch('/api/admin/club-credentials', { cache: 'no-store' })
      .then(async (response) => {
        if (!response.ok) throw new Error(response.status === 401 ? 'Admin login required.' : 'Could not load club accounts.');
        return response.json();
      })
      .then((accounts) => {
        for (const account of accounts) {
          const row = document.createElement('tr');
          for (const value of [account.clubName, account.email, account.password || 'Not available']) {
            const cell = document.createElement('td');
            const text = document.createElement(value === account.clubName ? 'span' : 'code');
            text.textContent = value;
            cell.append(text);
            row.append(cell);
          }
          rows.append(row);
        }
        status.textContent = `${accounts.length} club accounts`;
      })
      .catch((error) => { status.textContent = error.message; });
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.assign('/');
    });
  </script>
  <script src="/assets/js/theme.js?v=20261005d" defer></script>
    <script src="/assets/js/layout.js?v=4" defer></script>
  </body>
</html>
